spring.application.name=ChildShield

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/child_shield?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=kaushik
spring.datasource.password=kkj123

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
