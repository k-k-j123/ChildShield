<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChildShield - Login</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">CS</div>
        <h1>ChildShield</h1>
        <p>Rural Mother & Child Vaccination Tracker</p>
      </div>

      <div id="message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input
            id="username"
            type="text"
            placeholder="e.g. admin or sunita"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button class="btn btn-primary full" id="loginBtn" type="submit">
          Sign In
        </button>
      </form>

      <!-- <div style="text-align: center; margin-top: 24px; font-size: 13.5px;" class="muted">
        Don't have an account? <a class="link" href="register.html">Create an account</a>
      </div> -->
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () =>
        renderPage("index.html"),
      );
    </script>
  </body>
</html>
