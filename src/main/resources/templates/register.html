<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareTrack | Community Health</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { care: { 50:'#f1f8f4',100:'#e5f2eb',200:'#c8e5d5',500:'#218467',600:'#147d64',700:'#0f6652',900:'#172b27' } },
      fontFamily: { sans:['DM Sans','sans-serif'], display:['Manrope','sans-serif'] },
      boxShadow: { soft:'0 8px 28px rgba(25,58,48,.045)' }
    }}};
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    [hidden]{display:none!important}
    body{font-family:'DM Sans',sans-serif}
    .nav-link.active{background:#e5f2eb;color:#147d64;font-weight:700}
    .status{display:inline-flex;align-items:center;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700}
    .status-Overdue{background:#fdecea;color:#b94f48}.status-Due{background:#fff2dc;color:#a56b1d}
    .status-Upcoming{background:#eef0ff;color:#625ab0}.status-Completed{background:#e5f4ea;color:#287752}
    .toast{background:#193b30;color:white;border-radius:10px;padding:12px 16px;box-shadow:0 12px 35px #102c2233;font-size:13px;max-width:340px}
    .toast.error{background:#963e38}
    table{width:100%;border-collapse:collapse;white-space:nowrap}
    th{background:#fafcfb;color:#8a9790;font-size:10px;letter-spacing:.06em;text-align:left;padding:13px 16px;border-bottom:1px solid #edf1ee}
    td{padding:13px 16px;border-bottom:1px solid #f0f3f1;font-size:12px;color:#596a61}
    tr:last-child td{border-bottom:0}
  </style>
</head>
<body class="min-h-screen bg-[#f7f9f8] text-care-900">
<header class="flex items-center justify-between border-b border-slate-200 bg-white px-5 py-4 sm:px-10"><a href="index.html" class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-care-600 text-2xl font-bold text-white">+</span><strong class="font-display text-lg">CareTrack</strong></a><a href="index.html" class="text-sm font-bold text-care-700">Back to sign in</a></header>
<main class="mx-auto max-w-2xl px-5 py-10 sm:py-14"><div class="mb-8 text-center"><p class="text-xs font-bold tracking-widest text-care-700">JOIN CARETRACK</p><h1 class="mt-3 font-display text-3xl font-extrabold">Create your demo account</h1><p class="mt-2 text-sm text-slate-500">Set up a fictional profile to explore the prototype.</p></div>
<form id="registerForm" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-soft sm:p-8">
<div class="grid gap-5 sm:grid-cols-2">
<label class="text-sm font-semibold">Full name *<input name="name" required maxlength="80" class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm font-normal" placeholder="Your name"></label>
<label class="text-sm font-semibold">Email address *<input name="email" required type="email" class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm font-normal" placeholder="you@example.com"></label>
<label class="text-sm font-semibold">Password *<input name="password" required minlength="4" type="password" class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm font-normal" placeholder="At least 4 characters"></label>
<label class="text-sm font-semibold">Account type *<select name="role" class="mt-2 h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-sm font-normal"><option value="user">Mother / Guardian</option><option value="worker">Health worker (demo)</option><option value="admin">Administrator (demo)</option></select></label>
<label class="text-sm font-semibold sm:col-span-2">Village<input name="village" maxlength="80" class="mt-2 h-11 w-full rounded-xl border border-slate-200 px-3 text-sm font-normal" placeholder="e.g. Rampur"></label>
</div>
<p class="mt-5 text-xs leading-5 text-slate-400">Prototype note: this form stores demo account details in your browser only. Do not use real patient data or rely on this for secure access.</p>
<button class="mt-6 w-full rounded-xl bg-care-600 px-4 py-3.5 text-sm font-bold text-white hover:bg-care-700">Create demo account →</button>
</form></main><div id="toastRegion" class="fixed bottom-5 right-5 z-50 grid gap-2"></div><script src="api-contract.js"></script><script src="app.js"></script></body></html>
