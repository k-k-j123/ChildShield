<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChildShield - Register</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <div class="logo">CS</div>
        <h1>Create Account</h1>
        <p>Join ChildShield Vaccination Network</p>
      </div>

      <div id="message"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input id="fullName" type="text" placeholder="e.g. Dr. Sunita Rao or Priya Devi" required />
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" type="text" placeholder="e.g. sunita or priya123" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label for="role">Account Role</label>
          <select id="role" required>
            <option value="HEALTH_WORKER" selected>Health Worker (ASHA / ANM)</option>
          </select>
          <small class="muted" style="display:block; margin-top:6px; line-height: 1.4;">
            ℹ️ Mothers &amp; Guardians are enrolled directly by assigned Health Workers during field visits.
          </small>
        </div>

        <button class="btn btn-primary full" id="registerBtn" type="submit">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 13.5px;" class="muted">
        Already have an account? <a class="link" href="index.html">Sign In</a>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/pages.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => renderPage("register.html"));
    </script>
  </body>
</html>
